# Бот ставится на тот же VPS, где крутится главная панель 3X-UI.
# Long-polling => входящие порты НЕ нужны, наружу ничего не открываем.
services:
  bot:
    build: .
    container_name: 3xui-client-bot
    restart: always
    env_file: .env
    volumes:
      - ./data:/app/data        # SQLite бота переживает перезапуск/пересборку
      # БД панели для бэкапа — только чтение. Путь на хосте берётся из
      # XUI_DB_HOST_PATH (.env); если пусто — подставляется /dev/null, и x-ui
      # просто не бэкапится (Docker не создаёт «битую» директорию при отсутствии
      # файла). Доступ для non-root контейнера настраивает deploy.sh (ACL).
      - ${XUI_DB_HOST_PATH:-/dev/null}:/backup-src/x-ui.db:ro
      # То же самое для Marzban (PANEL_BACKEND=marzban) — путь на хосте берётся
      # из MARZBAN_DB_HOST_PATH, обычно /var/lib/marzban/db.sqlite3.
      - ${MARZBAN_DB_HOST_PATH:-/dev/null}:/backup-src/marzban.db:ro
      # Для «Добавить сервер» (NODE_PROVISION_ENABLED=true): TLS-сертификат
      # того же домена, что уже использует Marzban на 443 — Cloudflare
      # проксирует alt-порты (8443 и т.п.) как HTTPS и ждёт валидный TLS от
      # origin, голым HTTP получишь 525. Путь переопределяем через
      # MARZBAN_CERT_DIR, если панель не на этой же машине/не в этом пути.
      # Если каталога нет — бот просто не поднимет TLS на порту провижининга
      # (см. bot/http_api.py), сама панель этим не затронута.
      - ${MARZBAN_CERT_DIR:-/var/lib/marzban/certs}:/app/marzban-certs:ro
    # Если панель слушает на localhost хоста (127.0.0.1) — даём боту доступ
    # к сети хоста, чтобы XUI_BASE_URL мог быть http://127.0.0.1:PORT/...
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
