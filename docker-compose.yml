# Бот ставится на тот же VPS, где крутится главная панель 3X-UI.
# Long-polling => входящие порты НЕ нужны, наружу ничего не открываем.
services:
  bot:
    build: .
    container_name: 3xui-client-bot
    restart: always
    env_file: .env
    volumes:
      - ./data:/app/data        # SQLite бота переживает перезапуск/пересборку
      # БД панели для бэкапа — только чтение. Если 3X-UI установлен в другом месте,
      # поправь левый путь. Доступ для non-root контейнера настраивает deploy.sh (ACL).
      - /etc/x-ui/x-ui.db:/backup-src/x-ui.db:ro
    # Если панель слушает на localhost хоста (127.0.0.1) — даём боту доступ
    # к сети хоста, чтобы XUI_BASE_URL мог быть http://127.0.0.1:PORT/...
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
